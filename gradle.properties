# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目目录名含中文（冰箱），AGP 默认拦截非 ASCII 路径。
# 本项目为纯 Kotlin + Compose，无 NDK/CMake，关闭该检查可正常构建。
android.overridePathCheck=true

# Kotlin
kotlin.code.style=official

# 关键：必须使用进程内编译。
# Kotlin 编译守护进程在 Windows 上通过守护进程协议传递源文件路径时，
# 无法正确处理非 ASCII 路径（项目名「冰箱」会变成 \u51B0\u7BB1），
# 导致 "source file or directory not found"。
# 进程内模式下编译器直接在 Gradle JVM 里运行，路径以对象传递，不受影响。
kotlin.compiler.execution.strategy=in-process
